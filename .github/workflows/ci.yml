name: CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Añadir línea al README
        run: echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualiza README [skip ci]" || echo "Sin cambios"
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar DEV_TOKEN
        run: |
          if [ "${{ secrets.DEV_TOKEN }}" != "$LOCAL_DEV_TOKEN" ]; then
            echo "Token no coincide"
            exit 1
          fi
          echo "Token válido"
