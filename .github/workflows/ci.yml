name: CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

jobs:
  build:
    name: Job 1 - GitHub hosted
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Añadir feature al README
        run: |
          echo "Añadida feature: develop" >> README.md

      - name: Guardar cambios en README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Añadida feature: develop"
          git push

  validate:
    name: Job 2 - Self hosted
    runs-on: self-hosted
    needs: build

    steps:
      - name: Validar DEV_TOKEN
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if [ -z "$DEV_TOKEN" ]; then
            echo "DEV_TOKEN no está configurado"
            exit 1
          fi

          echo "DEV_TOKEN está configurado correctamente"
