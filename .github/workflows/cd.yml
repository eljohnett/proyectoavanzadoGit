name: CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Incrementar versión en README
        run: |
          CURRENT=$(grep -oE 'AppVersion-[0-9]+' README.md | tail -1)
          NUM=$(echo $CURRENT | grep -oE '[0-9]+$')
          NEXT=$((NUM + 1))
          echo "AppVersion-$NEXT ($(date '+%Y-%m-%d %H:%M:%S'))" >> README.md

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Bump version [skip ci]" || echo "Sin cambios"
          git push

  validate-prod:
    needs: bump-version
    runs-on: self-hosted
    steps:
      - name: Validar PROD_TOKEN
        run: |
          if [ "${{ secrets.PROD_TOKEN }}" != "$LOCAL_PROD_TOKEN" ]; then
            echo "Token no coincide"
            exit 1
          fi
          echo "Token válido"
